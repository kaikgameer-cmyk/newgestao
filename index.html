<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    
    <link rel="icon" href="/icon-ng-512.png" type="image/png" sizes="any" />
    <link rel="apple-touch-icon" href="/icon-ng-512.png" />
    <meta name="application-name" content="New Gestão" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="New Gestão" />
    <title>New Gestão - Controle Financeiro para Motoristas de App</title>
    <meta name="description" content="Controle financeiro simples para motoristas de Uber, 99 e InDrive. Veja quanto entrou, quanto saiu e quanto sobrou no fim da semana." />
    <meta name="author" content="New Gestão" />
    <meta property="og:title" content="New Gestão - Controle Financeiro para Motoristas" />
    <meta property="og:description" content="Veja quanto entrou, quanto saiu e quanto sobrou. Simples assim." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://newgestao.app" />
    <meta property="og:image" content="https://newgestao.app/icon-ng-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="New Gestão - Controle Financeiro para Motoristas" />
    <meta name="twitter:image" content="https://newgestao.app/icon-ng-512.png" />
    <link rel="manifest" href="/manifest.json?v=7" />
    <meta name="theme-color" content="#0B0F14" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator && window.location.hostname !== "localhost") {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/service-worker.js?v=7")
            .then((registration) => {
              console.log(
                "ServiceWorker registration successful with scope: ",
                registration.scope,
              );
              registration.update?.();
            })
            .catch((error) => {
              console.log("ServiceWorker registration failed: ", error);
            });
        });
      }
    </script>
  </body>
</html>
